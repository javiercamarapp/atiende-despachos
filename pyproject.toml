[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-ai"
version = "1.0.0"
description = "Agente IA enterprise para despachos contables (Atiende Despachos). Tool calling, ERP (CONTPAQi mock), facturación CFDI, multi-tenant, API dashboard y CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "lxml>=4.9",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
    "pydantic>=2.0",
    "bcrypt>=4.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "alembic>=1.13",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "cryptography>=42.0",
    "signxml>=3.2",
    "defusedxml>=0.7",
    "redis>=5.0",
    "pdfplumber>=0.11",
    "numpy>=1.24",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.3",
    # Cliente HTTP real usado por FacturapiAdapter (b2b_ai/integrations/sat/pacs/
    # facturapi_adapter.py) para llamar al API real de FacturAPI. Ya estaba
    # presente como dependencia de test (vía FastAPI TestClient); se promueve
    # a dependencia de runtime porque ahora también la usa código de producción.
    "httpx>=0.24",
    # Computer Use (b2b_ai/computer_use, modo mode=playwright: CONTPAQi/Aspel
    # reales). requirements-production.txt ya lo declaraba, pero el Dockerfile
    # de producción instala únicamente lo listado aquí (pip install .), así
    # que sin esta línea el paquete playwright nunca llegaba a la imagen de
    # Railway y mode=playwright fallaba en runtime con ModuleNotFoundError.
    "playwright>=1.40",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21", "httpx>=0.24"]
# RPA de escritorio para CONTPAQi (b2b_ai/computer_use/contpaqi_rpa_backend.py).
# Sólo aplica en Windows (pywinauto controla ventanas Win32/UIA); el marker de
# entorno evita instalarla en cualquier otra plataforma. Import perezoso en
# el código: si falta, el driver cae al simulador HTTP local con una
# advertencia explícita en vez de fallar en import.
rpa_escritorio = ["pywinauto>=0.6.8; platform_system=='Windows'"]

[project.scripts]
bb-ai = "b2b_ai.cli:main"

[tool.setuptools.packages.find]
include = ["b2b_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "computer_use_e2e: End-to-end Computer Use tests that launch real Chromium via Playwright. These require the Playwright browsers installed (playwright install chromium).",
    "e2e: End-to-end tests that require live external services.",
    "slow: Performance/benchmark tests with a real (non-mocked) time budget. Not excluded from the default CI run — the global pytest --timeout already bounds worst-case runtime — but marked so a future 'not slow' fast-tier filter can skip them deliberately.",
]
# Los E2E de Computer Use (Chromium real) se excluyen del CI estándar salvo que
# PLAYWRIGHT_BROWSERS esté disponible; se ejecutan explícitamente.
addopts = "--strict-markers"
