# =============================================================================
# Likida AI Enterprise — docker-compose.yml · Stack completo de producción
#
# Servicios: app (FastAPI/uvicorn), db (PostgreSQL), redis (cache), nginx
# (reverse proxy / TLS / rate limiting).
#
# Uso:
#   cp .env.example .env && edita los secretos
#   docker compose up -d --build
#   curl http://localhost/health
#
# Variables de entorno: leídas desde `.env` (referenciadas como ${VAR}).
# =============================================================================

name: b2b-ai

services:
  # ---- App: API FastAPI servida por uvicorn -------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: b2b-ai:1.0.0
    container_name: b2b-ai-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATABASE_URL: db.py detecta esta variable y usa PostgreSQL (psycopg3).
      # Si no está seteada, fallback a SQLite (B2B_DB_PATH). Railway la inyecta.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-b2b}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@db:5432/${POSTGRES_DB:-b2b_ai}
      - B2B_DB_PATH=/data/b2b_ai.db
      - B2B_WORKERS=${B2B_WORKERS:-1}
      - REDIS_URL=redis://redis:6379/0
      - B2B_TRUST_PROXY=${B2B_TRUST_PROXY:-true}
    volumes:
      - app-data:/data
    # No se expone al host: solo Nginx habla con el API.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      internal:
        # Alias `api` para que el upstream de nginx (`server api:8000`) resuelva
        # a este contenedor. Mantiene compatibilidad con docker-compose.prod.yml.
        aliases:
          - api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---- DB: PostgreSQL (objetivo de producción) -----------------------------
  # H-18 / RLS (ver migrations/versions/0016_rls_tenant_isolation.py):
  # POSTGRES_USER aquí es el rol BOOTSTRAP de la imagen oficial de Postgres,
  # que initdb crea como SUPERUSUARIO. La app (servicio `app` arriba) se
  # conecta con ESTE MISMO rol vía DATABASE_URL -- y un superusuario
  # SIEMPRE bypasea Row-Level Security, incluso con FORCE ROW LEVEL
  # SECURITY (verificado adversarialmente: ver
  # tests/adversarial/test_rls_tenant_isolation_pg.py y el hallazgo en el
  # commit de 0016). Es decir: tal como está configurado este
  # docker-compose.yml HOY, las políticas RLS que crea 0016 no protegen
  # nada para el rol que la app usa en runtime -- solo protegen al rol
  # `despachos_app_rls` (creado por esa misma migración, NOSUPERUSER
  # NOBYPASSRLS) si algún día `DATABASE_URL` del servicio `app` se cambia
  # para conectar con ÉL en vez de con `POSTGRES_USER`. No se hizo ese
  # cambio en este PR porque el arranque de la app corre sus propias
  # migraciones de Alembic contra ESTE MISMO DATABASE_URL (ver
  # b2b_ai/api/app.py::create_app -> lifespan), y `despachos_app_rls`
  # deliberadamente NO tiene privilegio de DDL (CREATE ROLE / ALTER TABLE
  # ... ENABLE|FORCE ROW LEVEL SECURITY / CREATE POLICY) -- separar
  # "identidad de migración" de "identidad de runtime" exige una segunda
  # variable de entorno y tocar ese lifespan, fuera del alcance de esta
  # migración de esquema.
  db:
    image: postgres:16-alpine
    container_name: b2b-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-b2b_ai}
      POSTGRES_USER: ${POSTGRES_USER:-b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-b2b} -d ${POSTGRES_DB:-b2b_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis: cache --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: b2b-ai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Nginx: reverse proxy, TLS, rate limiting ----------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: b2b-ai-nginx
    restart: unless-stopped
    ports:
      - "${B2B_HTTP_PORT:-80}:80"
      - "${B2B_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

networks:
  # Red interna bridge: los servicios se hablan entre sí por nombre; el host
  # solo alcanza el stack vía Nginx (puertos 80/443).
  internal:
    driver: bridge

volumes:
  app-data:      # fallback SQLite (solo si no hay DATABASE_URL)
  db-data:       # datos de PostgreSQL (producción)
  redis-data:    # AOF de Redis
