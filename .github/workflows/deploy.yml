name: CI - Test Atiende Despachos
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-production.txt
          pip install pytest pytest-timeout pytest-asyncio httpx 'psycopg[binary]' psycopg-pool reportlab playwright bandit
          pip install -e .

      - name: Instalar Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Recopilar tests (sin bloqueos de import)
        run: |
          python -m compileall -q b2b_ai/
          B2B_ENV=development python -c "import b2b_ai.features.diot; import b2b_ai.api.app; print('imports OK')"
        env:
          B2B_ENV: development

      - name: Ejecutar suite de tests
        # --timeout mata tests colgados (init pesado de app.py); -x no; corre todo
        run: pytest -q --timeout=120 -m "not computer_use_e2e" --ignore=tests/test_computer_use_e2e.py
        env:
          B2B_ENV: development

      - name: Ejecutar E2E Computer Use (Chromium real)
        run: pytest -q --timeout=180 tests/test_computer_use_e2e.py
        env:
          B2B_ENV: development

      - name: Security lint (bandit)
        # -lll reporta únicamente severidad HIGH; sin "|| true" el build
        # falla si aparece un hallazgo HIGH. La deuda MEDIUM/LOW se sigue
        # auditando aparte, pero ya no se puede mezclar con un HIGH real y
        # que el pipeline pase en verde igual.
        run: bandit -r b2b_ai/ -lll --skip B101
